name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。 / Chinese or English are both fine.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 你在做什么，遇到了什么不便？ / What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分 / Area
      multiple: true
      options:
        - WebUI
        - 聊天与回复 / Chat and replies
        - 记忆与知识库 / Memory and knowledge base
        - 主动性引擎与提醒 / Proactive engine and reminders
        - 插件与技能 / Plugins and Skills
        - 部署 / Deployment
        - 多语言 / Translations
        - 其他 / Other
